<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q-Q Plot Diagnostics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0f14;
    --surface: #16181f;
    --border: #262933;
    --text: #e8eaf0;
    --muted: #6b7080;
    --accent: #f0c060;
    --good: #5ddba8;
    --bad: #f06060;
    --blue: #6090f0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 48px 32px;
  }

  header {
    max-width: 1100px;
    margin: 0 auto 56px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 32px;
  }

  header h1 {
    font-family: 'Inter', system-ui, sans-serif;
    font-style: italic;
    font-size: clamp(2rem, 4vw, 3.2rem);
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  header p {
    color: var(--muted);
    font-size: 0.95rem;
    letter-spacing: 0.01em;
  }

  .cases {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 64px;
  }

  .case-block {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: start;
  }

  .case-header {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  .case-number {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .case-title {
    font-family: 'Instrument Serif', serif;
    font-size: 1.5rem;
    color: var(--text);
  }

  .badge {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    background: color-mix(in srgb, var(--bad) 12%, transparent);
    color: var(--bad);
    border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent);
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
  }

  .chart-card h3 {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .chart-card svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .explanation {
    grid-column: 1 / -1;
    background: color-mix(in srgb, var(--accent) 6%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 20px 24px;
  }

  .explanation strong {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
    margin-bottom: 6px;
  }

  .explanation p {
    font-size: 0.9rem;
    line-height: 1.7;
    color: color-mix(in srgb, var(--text) 80%, transparent);
  }

  .divider {
    max-width: 1100px;
    margin: 0 auto;
    border: none;
    border-top: 1px solid var(--border);
  }

  /* normal case gets green badge */
  .badge-good {
    background: color-mix(in srgb, var(--good) 12%, transparent);
    color: var(--good);
    border-color: color-mix(in srgb, var(--good) 30%, transparent);
  }
</style>
</head>
<body>

<header>
  <h1>Q-Q Plot Diagnostics</h1>
  <p>Each case shows the underlying data distribution alongside its Q-Q plot — so you can see exactly how distribution shape maps to plot shape.</p>
</header>

<div class="cases" id="cases"></div>

<script>
// ── helpers ──────────────────────────────────────────────────────────────────

// Box-Muller normal random
function randn() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// Approximate inverse normal CDF (Beasley-Springer-Moro)
function normInv(p) {
  const a = [0, -3.969683028665376e1, 2.209460984245205e2,
    -2.759285104469687e2, 1.383577518672690e2,
    -3.066479806614716e1, 2.506628277459239];
  const b = [-5.447609879822406e1, 1.615858368580409e2,
    -1.556989798598866e2, 6.680131188771972e1, -1.328068155288572e1];
  const c = [-7.784894002430293e-3, -3.223964580411365e-1,
    -2.400758277161838, -2.549732539343734,
    4.374664141464968, 2.938163982698783];
  const d = [7.784695709041462e-3, 3.224671290700398e-1,
    2.445134137142996, 3.754408661907416];
  const pLow = 0.02425, pHigh = 1 - pLow;
  let q, r;
  if (p < pLow) {
    q = Math.sqrt(-2 * Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  } else if (p <= pHigh) {
    q = p - 0.5; r = q*q;
    return (((((a[1]*r+a[2])*r+a[3])*r+a[4])*r+a[5])*r+a[6])*q /
           (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  } else {
    q = Math.sqrt(-2 * Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
             ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
}

function qqPoints(data) {
  const sorted = [...data].sort((a, b) => a - b);
  const n = sorted.length;
  return sorted.map((v, i) => ({
    theoretical: normInv((i + 0.5) / n),
    sample: v
  }));
}

function jitter(x, amt = 0.15) { return x + (Math.random() - 0.5) * amt; }

// ── data generators ──────────────────────────────────────────────────────────

function makeNormal(n = 300) {
  return Array.from({length: n}, () => randn());
}

function makeRightSkew(n = 300) {
  // log-normal
  return Array.from({length: n}, () => Math.exp(randn() * 0.8));
}

function makeLeftSkew(n = 300) {
  return makeRightSkew(n).map(x => -x);
}

function makeHeavyTails(n = 300) {
  // t-distribution with 2 df (very heavy)
  return Array.from({length: n}, () => {
    const z1 = randn(), z2 = randn();
    return z1 / Math.sqrt((z1*z1 + z2*z2) / 2);
  });
}

function makeLightTails(n = 300) {
  // Uniform-ish: mix of truncated normals
  return Array.from({length: n}, () => {
    let v;
    do { v = randn(); } while (Math.abs(v) > 1.6);
    return v;
  });
}

function makeBimodal(n = 300) {
  return Array.from({length: n}, (_, i) =>
    i < n/2 ? randn() * 0.6 - 2 : randn() * 0.6 + 2
  );
}

// ── rendering ─────────────────────────────────────────────────────────────────

const W = 400, H = 320, M = {top: 20, right: 20, bottom: 44, left: 48};
const iW = W - M.left - M.right, iH = H - M.top - M.bottom;

const COLORS = {
  dot: '#6090f0',
  hist: '#6090f0',
  refLine: '#f0c060',
  axis: '#3a3d4a',
  label: '#6b7080',
  bad: '#f06060',
  good: '#5ddba8'
};

function svgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function renderHistogram(data, container, color = COLORS.hist) {
  const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`});
  const g = svgEl('g', {transform: `translate(${M.left},${M.top})`});
  svg.appendChild(g);

  const xScale = d3.scaleLinear().domain(d3.extent(data)).nice().range([0, iW]);
  const bins = d3.bin().domain(xScale.domain()).thresholds(30)(data);
  const yScale = d3.scaleLinear().domain([0, d3.max(bins, d => d.length)]).range([iH, 0]);

  // grid lines
  for (const y of yScale.ticks(4)) {
    const line = svgEl('line', {x1: 0, x2: iW, y1: yScale(y), y2: yScale(y),
      stroke: COLORS.axis, 'stroke-width': 1, 'stroke-dasharray': '3,4'});
    g.appendChild(line);
  }

  // bars
  for (const bin of bins) {
    const bw = Math.max(0, xScale(bin.x1) - xScale(bin.x0) - 1);
    const rect = svgEl('rect', {
      x: xScale(bin.x0), y: yScale(bin.length),
      width: bw, height: iH - yScale(bin.length),
      fill: color, opacity: 0.65, rx: 1
    });
    g.appendChild(rect);
  }

  // axes
  const xAxis = svgEl('g', {transform: `translate(0,${iH})`});
  const xLine = svgEl('line', {x1: 0, x2: iW, stroke: COLORS.axis, 'stroke-width': 1});
  xAxis.appendChild(xLine);
  for (const t of xScale.ticks(5)) {
    const tick = svgEl('g', {transform: `translate(${xScale(t)},0)`});
    tick.appendChild(svgEl('line', {y2: 5, stroke: COLORS.axis}));
    const label = svgEl('text', {
      y: 18, 'text-anchor': 'middle',
      fill: COLORS.label, 'font-size': '11', 'font-family': 'DM Mono, monospace'
    });
    label.textContent = d3.format('.1f')(t);
    tick.appendChild(label);
    xAxis.appendChild(tick);
  }
  g.appendChild(xAxis);

  // x label
  const xl = svgEl('text', {
    x: iW/2, y: iH + 40, 'text-anchor': 'middle',
    fill: COLORS.label, 'font-size': '11', 'font-family': 'DM Sans, sans-serif'
  });
  xl.textContent = 'Value';
  g.appendChild(xl);

  container.appendChild(svg);
}

function renderQQ(data, container, dotColor = COLORS.dot) {
  const pts = qqPoints(data);
  const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`});
  const g = svgEl('g', {transform: `translate(${M.left},${M.top})`});
  svg.appendChild(g);

  const xExt = d3.extent(pts, d => d.theoretical);
  const yExt = d3.extent(pts, d => d.sample);
  const pad = 0.3;
  const xScale = d3.scaleLinear().domain([xExt[0]-pad, xExt[1]+pad]).range([0, iW]);
  const yScale = d3.scaleLinear().domain([yExt[0]-pad, yExt[1]+pad]).range([iH, 0]);

  // grid
  for (const y of yScale.ticks(4)) {
    g.appendChild(svgEl('line', {x1: 0, x2: iW, y1: yScale(y), y2: yScale(y),
      stroke: COLORS.axis, 'stroke-width': 1, 'stroke-dasharray': '3,4'}));
  }

  // reference line (through Q1 and Q3)
  const q1th = normInv(0.25), q3th = normInv(0.75);
  const sorted = [...data].sort((a,b) => a-b);
  const n = sorted.length;
  const q1s = sorted[Math.floor(n*0.25)];
  const q3s = sorted[Math.floor(n*0.75)];
  const slope = (q3s - q1s) / (q3th - q1th);
  const intercept = q1s - slope * q1th;
  const x0 = xExt[0]-pad, x1 = xExt[1]+pad;
  g.appendChild(svgEl('line', {
    x1: xScale(x0), y1: yScale(slope*x0+intercept),
    x2: xScale(x1), y2: yScale(slope*x1+intercept),
    stroke: COLORS.refLine, 'stroke-width': 1.5, opacity: 0.7
  }));

  // dots (subsample for perf)
  const step = Math.max(1, Math.floor(pts.length / 150));
  for (let i = 0; i < pts.length; i += step) {
    const p = pts[i];
    g.appendChild(svgEl('circle', {
      cx: xScale(p.theoretical), cy: yScale(p.sample),
      r: 3, fill: dotColor, opacity: 0.65
    }));
  }

  // axes
  const xAxis = svgEl('g', {transform: `translate(0,${iH})`});
  xAxis.appendChild(svgEl('line', {x1: 0, x2: iW, stroke: COLORS.axis}));
  for (const t of xScale.ticks(5)) {
    const tick = svgEl('g', {transform: `translate(${xScale(t)},0)`});
    tick.appendChild(svgEl('line', {y2: 5, stroke: COLORS.axis}));
    const lbl = svgEl('text', {y: 18, 'text-anchor': 'middle',
      fill: COLORS.label, 'font-size': '11', 'font-family': 'DM Mono, monospace'});
    lbl.textContent = d3.format('.1f')(t);
    tick.appendChild(lbl);
    xAxis.appendChild(tick);
  }
  g.appendChild(xAxis);

  const yAxis = svgEl('g');
  yAxis.appendChild(svgEl('line', {y1: 0, y2: iH, stroke: COLORS.axis}));
  for (const t of yScale.ticks(4)) {
    const tick = svgEl('g', {transform: `translate(0,${yScale(t)})`});
    tick.appendChild(svgEl('line', {x2: -5, stroke: COLORS.axis}));
    const lbl = svgEl('text', {x: -10, 'text-anchor': 'end', dy: '0.35em',
      fill: COLORS.label, 'font-size': '11', 'font-family': 'DM Mono, monospace'});
    lbl.textContent = d3.format('.1f')(t);
    tick.appendChild(lbl);
    yAxis.appendChild(tick);
  }
  g.appendChild(yAxis);

  // axis labels
  const xl = svgEl('text', {x: iW/2, y: iH+40, 'text-anchor': 'middle',
    fill: COLORS.label, 'font-size': '11', 'font-family': 'DM Sans, sans-serif'});
  xl.textContent = 'Theoretical quantiles';
  g.appendChild(xl);

  const yl = svgEl('text', {
    transform: `translate(-38,${iH/2}) rotate(-90)`,
    'text-anchor': 'middle',
    fill: COLORS.label, 'font-size': '11', 'font-family': 'DM Sans, sans-serif'
  });
  yl.textContent = 'Sample quantiles';
  g.appendChild(yl);

  container.appendChild(svg);
}

// ── cases ─────────────────────────────────────────────────────────────────────

const cases = [
  {
    n: '01',
    title: 'Normal distribution',
    badge: 'Ideal — passes check',
    badgeClass: 'badge-good',
    data: makeNormal,
    dotColor: COLORS.good,
    histColor: COLORS.good,
    explanation: `Points lie close to the reference line with only minor random scatter near the tails. This is what you want to see: the sample quantiles match theoretical normal quantiles throughout the range. No transformation needed.`
  },
  {
    n: '02',
    title: 'Right skew (log-normal)',
    badge: 'Problematic',
    data: makeRightSkew,
    explanation: `The histogram has a long right tail — many small values, a few very large ones. On the Q-Q plot this appears as points curving upward above the reference line at the right end. The upper tail of the data is much larger than normal theory predicts. Fix: try a log transform.`
  },
  {
    n: '03',
    title: 'Left skew',
    badge: 'Problematic',
    data: makeLeftSkew,
    explanation: `Mirror image of right skew. The histogram has a long left tail. On the Q-Q plot, points curve downward below the reference line at the left end — the lower tail is more extreme than normal. Fix: try squaring or reflecting + log.`
  },
  {
    n: '04',
    title: 'Heavy tails (t-distribution, df=2)',
    badge: 'Problematic',
    data: makeHeavyTails,
    explanation: `The histogram looks roughly bell-shaped but with more extreme outliers. On the Q-Q plot this creates the classic S-curve: points fall below the line on the left and above it on the right. Both tails are fatter than normal. This is common with financial returns. Fix: consider a t-distribution model.`
  },
  {
    n: '05',
    title: 'Light tails (truncated)',
    badge: 'Problematic',
    data: makeLightTails,
    explanation: `Data is bounded — no extreme values. The histogram looks like a squashed bell. On the Q-Q plot, points form an inverted S: they're above the line on the left (the lower tail isn't as extreme as normal) and below it on the right. Fix: consider a bounded or uniform-mixture model.`
  },
  {
    n: '06',
    title: 'Bimodal distribution',
    badge: 'Problematic',
    data: makeBimodal,
    explanation: `Two separate humps in the histogram — a classic sign of two subpopulations mixed together. The Q-Q plot shows a steep vertical jump in the middle where the data "skips" the gap between modes, then flattens out. Normal theory has no concept of a gap. Fix: investigate whether data should be split by group.`
  }
];

const container = document.getElementById('cases');

for (const c of cases) {
  const data = c.data(300);

  const block = document.createElement('div');
  block.className = 'case-block';

  // header
  const header = document.createElement('div');
  header.className = 'case-header';
  header.innerHTML = `
    <span class="case-number">Case ${c.n}</span>
    <span class="case-title">${c.title}</span>
    <span class="badge ${c.badgeClass || ''}">${c.badge}</span>
  `;
  block.appendChild(header);

  // histogram card
  const hCard = document.createElement('div');
  hCard.className = 'chart-card';
  hCard.innerHTML = '<h3>Data distribution (histogram)</h3>';
  renderHistogram(data, hCard, c.histColor || COLORS.hist);
  block.appendChild(hCard);

  // qq card
  const qCard = document.createElement('div');
  qCard.className = 'chart-card';
  qCard.innerHTML = '<h3>Q-Q plot vs. Normal</h3>';
  renderQQ(data, qCard, c.dotColor || COLORS.dot);
  block.appendChild(qCard);

  // explanation
  const exp = document.createElement('div');
  exp.className = 'explanation';
  exp.innerHTML = `<strong>What's happening</strong><p>${c.explanation}</p>`;
  block.appendChild(exp);

  container.appendChild(block);

  // divider between cases
  if (c !== cases[cases.length - 1]) {
    const hr = document.createElement('hr');
    hr.className = 'divider';
    container.appendChild(hr);
  }
}
</script>
</body>
</html>
